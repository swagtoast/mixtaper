name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pytest
      - run: python -m pytest -q tests/test_basic.py tests/test_undo.py tests/test_editor.py tests/test_cuts.py

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller pillow
      - name: Build
        run: python packaging/build.py
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: dist/Mixtaper.app/Contents/Resources/mixtaper/mixtaper --selftest
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        run: dist/Mixtaper.exe --selftest
      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        run: dist/mixtaper --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: mixtaper-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
