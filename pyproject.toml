[project]
name = "mixtaper"
version = "0.1.0"
description = "Split a DJ mix into individually tagged tracks, trackid-style."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "shazamio-core>=1.1",
    "aiohttp>=3.9",
    "textual>=0.80",
    "mutagen>=1.47",
    "numpy>=1.26",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10", "pillow>=10"]

[project.scripts]
mixtaper = "mixtaper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mixtaper"]
